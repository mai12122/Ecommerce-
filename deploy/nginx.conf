events { worker_connections 1024; }

http {
    upstream ecommerce_backend_cluster {
        # Docker handles internal DNS and distributes requests to all replicas named 'backend'
        server backend:8000; 
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ecommerce_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}